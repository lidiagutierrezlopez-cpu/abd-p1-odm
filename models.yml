# Definición de los modelos del ODM.
#
# Por cada modelo se declara:
#   required_vars    atributos que TIENEN que estar en cada documento
#   admissible_vars  atributos válidos que no tienen por qué estar
#   unique_indexes   índices con restricción de unicidad
#   regular_indexes  índices ascendentes normales
#   location_index   campo de dirección del que se derivará el punto GeoJSON
#
# Ojo con location_index: se declara el campo BASE de la dirección. El punto
# GeoJSON se guardará en <campo>_loc, y es sobre ese campo sobre el que hay
# que crear el índice 2dsphere.

Recinto:
  required_vars:
    - nombre
    - direccion
    - aforo
    - zonas
  admissible_vars:
    - servicios
    - direccion_loc
  unique_indexes: []
  regular_indexes:
    - nombre
    - aforo
  location_index: direccion

Artista:
  required_vars:
    - nombre
    - generos
    - pais_origen
    - anio_inicio
  admissible_vars:
    - biografia
    - redes_sociales
  unique_indexes:
    - nombre
  regular_indexes:
    - generos
    - pais_origen

Evento:
  required_vars:
    - titulo
    - artistas
    - recinto
    - fecha_hora
    - precio_por_zona
  admissible_vars:
    - entradas_vendidas
  unique_indexes: []
  regular_indexes:
    - fecha_hora
    - artistas
    - recinto

Asistente:
  required_vars:
    - nombre
    - correo
    - fecha_alta
  admissible_vars:
    - direccion
    - direccion_loc
    - preferencias_genero
  unique_indexes:
    - correo
  regular_indexes:
    - fecha_alta
  location_index: direccion